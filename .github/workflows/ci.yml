name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  # ---------------------------------------------------------------------------
  # Lint, tip kontrolü, derleme + SÖZLEŞME KOPYASI TAZE Mİ
  # ---------------------------------------------------------------------------
  verify:
    name: Lint · Typecheck · Sözleşme · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      INTERNAL_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3001

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      # Sözleşme kopyasının tazeliğini kontrol etmek için Api deposu gerekir.
      - name: Api deposunu çek (sözleşme kaynağı)
        uses: actions/checkout@v4
        with:
          repository: EmreKaya2000/zirve-tarim-api
          path: .zirve-api
          # GITHUB_TOKEN DEĞİL: o jeton YALNIZ kendi deposunu görür ve
          # zirve-tarim-api private olduğu için "Not Found" ile düşer — hata
          # "yetkin yok" değil "yok" dediği için yanıltıcıdır. Depo
          # bölünmesinden beri CI bu adımda kırılıyordu.
          #
          # Kimlik: zirve-tarim-api deposuna eklenmiş SALT OKUNUR bir deploy
          # key. Gizli yarısı bu depoda ZIRVE_API_SSH_KEY sırrında durur ve
          # checkout HTTPS yerine SSH ile klonlar.
          #
          # PAT yerine deploy key: PAT'ın SÜRESİ DOLAR ve dolduğunda CI yine
          # yukarıdaki "Not Found" ile kırmızıya döner. Deploy key'in süresi
          # yoktur, kapsamı tek depodur ve yazma yetkisi yoktur.
          #
          # Bilerek yedeklenmiyor: eksik anahtar sessizce başka bir yola
          # düşmek yerine açıkça patlamalı.
          ssh-key: ${{ secrets.ZIRVE_API_SSH_KEY }}

      - name: pnpm kur
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------------
      # SÖZLEŞME AYRIŞMA KONTROLÜ — bu işin en önemli adımı
      #
      # `src/types` Api deposundan kopyadır. Elle düzenlenirse ya da Api'de
      # değişip burada senkronlanmazsa, panel/vitrin API'nin reddedeceği bir
      # davranışı kullanıcıya sunabilir. Bu sınıf hata projede bir kez yaşandı:
      # form `limit=200` gönderiyordu, API'nin sınırı 100'dü; yedi taksonomi
      # listesi 400 dönüyor ve varyasyon oluşturulamıyordu.
      # ---------------------------------------------------------------------
      - name: Sözleşme kopyası taze mi (@zirve/types)
        run: ZIRVE_API_REPO=.zirve-api pnpm types:check

      - name: Biçim kontrolü
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tip kontrolü
        run: pnpm typecheck

      - name: Derleme
        run: pnpm build

  # ---------------------------------------------------------------------------
  # TARAYICI TESTLERİ — ayakta bir API ve seed edilmiş veritabanı gerektirir
  # ---------------------------------------------------------------------------
  e2e:
    name: Playwright · Panel Zinciri
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zirve
          POSTGRES_PASSWORD: zirve
          POSTGRES_DB: zirve_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zirve -d zirve_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # MAILPIT YOK: e-posta akışı (doğrulama, şifre sıfırlama) MÜŞTERİ
      # tarafındadır ve vitrin deposunda test edilir. Panelin e-posta
      # gönderdiği bir akış yok, bu yüzden posta yakalayıcı gereksiz.

    env:
      DATABASE_URL: postgresql://zirve:zirve@localhost:5432/zirve_ci?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-en-az-otuz-iki-karakter-uzunlugunda
      JWT_REFRESH_SECRET: ci-refresh-secret-en-az-otuz-iki-karakter-uzunlugunda
      JWT_CUSTOMER_ACCESS_SECRET: ci-customer-secret-en-az-otuz-iki-karakter-uzunlugunda
      API_PORT: '4000'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
      INTERNAL_API_URL: http://127.0.0.1:4000/api/v1
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3101

      # Tarayıcı API'ye DOĞRUDAN istek atar (sepet doğrulama, talep gönderme).
      # Test sunucusunun kökeni whitelist'te olmazsa CORS'a takılır.
      CORS_ORIGINS: http://127.0.0.1:3101,http://localhost:3101

      # Rate limit KAPALI: giriş ucu 5 istek/dakika ile sınırlı ve panel
      # paketi bundan fazla giriş yapıyor. NODE_ENV=test throttler'ı atlar.
      NODE_ENV: test

      # E-posta gönderilmez: panel akışlarında posta yok.
      MAIL_DRIVER: log
      PUBLIC_WEB_URL: http://127.0.0.1:3100

    steps:
      - name: Panel deposunu çek
        uses: actions/checkout@v4

      - name: Api deposunu çek
        uses: actions/checkout@v4
        with:
          repository: EmreKaya2000/zirve-tarim-api
          path: .zirve-api
          # GITHUB_TOKEN DEĞİL: o jeton YALNIZ kendi deposunu görür ve
          # zirve-tarim-api private olduğu için "Not Found" ile düşer — hata
          # "yetkin yok" değil "yok" dediği için yanıltıcıdır. Depo
          # bölünmesinden beri CI bu adımda kırılıyordu.
          #
          # Kimlik: zirve-tarim-api deposuna eklenmiş SALT OKUNUR bir deploy
          # key. Gizli yarısı bu depoda ZIRVE_API_SSH_KEY sırrında durur ve
          # checkout HTTPS yerine SSH ile klonlar.
          #
          # PAT yerine deploy key: PAT'ın SÜRESİ DOLAR ve dolduğunda CI yine
          # yukarıdaki "Not Found" ile kırmızıya döner. Deploy key'in süresi
          # yoktur, kapsamı tek depodur ve yazma yetkisi yoktur.
          #
          # Bilerek yedeklenmiyor: eksik anahtar sessizce başka bir yola
          # düşmek yerine açıkça patlamalı.
          ssh-key: ${{ secrets.ZIRVE_API_SSH_KEY }}

      - name: pnpm kur
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Panel bağımlılıkları
        run: pnpm install --frozen-lockfile

      - name: API bağımlılıkları
        working-directory: .zirve-api
        run: pnpm install --frozen-lockfile

      - name: Playwright tarayıcısı kur
        run: pnpm exec playwright install --with-deps chromium

      - name: Migration ve seed
        working-directory: .zirve-api
        env:
          SEED_DEMO_DATA: 'true'
        run: |
          pnpm prisma:migrate:deploy
          pnpm prisma:seed

      - name: API'yi başlat
        working-directory: .zirve-api
        run: |
          # `pnpm build` (turbo) YERINE `--filter @zirve/api` KULLANMAYIN.
          # Filtre yalniz API paketini derler, workspace bagimliligi olan
          # @zirve/types'i DERLEMEZ; `nest build` o zaman her dosyada
          # "Cannot find module '@zirve/types'" der. Turbo bagimlilik
          # grafigine uyup once types'i derler.
          pnpm build
          node apps/api/dist/main.js &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:4000/health

      - name: Paneli derle
        # Playwright derlenmiş standalone sunucuyu çalıştırır; derleme
        # atlanırsa sunucu hiç açılmaz.
        run: pnpm build

      - name: Playwright testleri
        run: pnpm test:e2e

      - name: Playwright raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
